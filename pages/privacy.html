<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্রাইভেসি পলিসি — Gournadi Digital</title>
<meta name="description" content="আপনার ডেটা কীভাবে সংগ্রহ, ব্যবহার ও সুরক্ষিত রাখা হয় — সম্পূর্ণ প্রাইভেসি পলিসি।">
<link rel="icon" href="../assets/logo.svg">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div data-header></div>

<section class="page-hero">
  <div class="wrap page-hero__inner">
    <div class="crumbs"><a href="../index.html">হোম</a><span class="sep">/</span><span>প্রাইভেসি</span></div>
    <span class="page-hero__chip">GDPR-style transparency</span>
    <h1 data-privacy-title>প্রাইভেসি পলিসি</h1>
    <p>আপনার ব্যক্তিগত তথ্যের সুরক্ষা আমাদের দায়িত্ব। সংগ্রহ, ব্যবহার ও অধিকার — সবকিছু সহজ ভাষায়।</p>
  </div>
</section>

<div class="crumbs-bar">
  <div class="wrap">
    <a href="../index.html">হোম</a><span class="sep">›</span>
    <a href="#">সহায়তা</a><span class="sep">›</span>
    <span>প্রাইভেসি</span>
  </div>
</div>

<main class="wrap" style="padding:40px 20px 64px">
  <nav class="legal__toc" data-toc>
    <h4>এই পেজে</h4>
    <ol></ol>
  </nav>
  <div data-privacy-body></div>
</main>

<div data-footer></div>

<script src="../js/config.js"></script>
<script src="../js/store.js"></script>
<script src="../js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  UI.mount();
  const L = CONFIG.legal.privacy;
  document.querySelector('[data-privacy-title]').textContent = L.title;
  const body = document.querySelector('[data-privacy-body]');
  body.innerHTML = UI.legal('privacy');

  const ol = document.querySelector('[data-toc] ol');
  if (ol) {
    L.sections.forEach(s => {
      const li = document.createElement('li');
      li.innerHTML = `<a href="#${UI.slugify(s.h)}">${s.h}</a>`;
      ol.append(li);
    });
  }
});
</script>
</body>
</html>
